services:
  mongo:
    image: mongo:4.4
    #container_name: dt-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - twin-net

  orion:
    image: fiware/orion-ld:latest
    #container_name: dt-orion-ld
    ports:
      - "1026:1026"
    depends_on:
      - mongo
    command: -dbhost mongo -logLevel DEBUG
    networks:
      - twin-net

  timescaledb:
    image: timescale/timescaledb-ha:pg15-latest
    #container_name: dt-timescaledb
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-dalarna_dt}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    networks:
      - twin-net

  # --- APPLICATION: FastAPI (interface principale, /admin, API) + ordonnanceur d'ingestion ---
  ingestor:
    build: .
    #container_name: dt-ingestor
    restart: always # Redémarre automatiquement si Docker ou la machine reboot
    env_file: .env
    environment:
      - POSTGRES_HOST=timescaledb
      - ORION_URL=http://orion:1026/ngsi-ld/v1/entities
    ports:
      - "8000:8000"
    volumes:
      - .:/app    # <-- Les modifs du code et de static/ sont visibles (redémarrer pour le code Python)
    depends_on:
      - orion
      - timescaledb
    networks:
      - twin-net

  # --- NOUVEAU SERVICE: DASHBOARD & ANALYTICS ---
  grafana:
    image: grafana/grafana:latest
    #container_name: dt-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      # --- AUTORISER L'INTÉGRATION ET LE RENDU EN IFRAME ---
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS_VIEWER:-false}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SAMESITE=disabled
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - timescaledb
    networks:
      - twin-net
      
networks:
  twin-net:
    driver: bridge

volumes:
  mongo_data:
  timescale_data:
  grafana_data:   # <--- Ajouter ce volume persistant